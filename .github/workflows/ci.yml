name: CI

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: grihasti
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports: [ '5432:5432' ]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10

    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/grihasti
      PGSSL: disable
      NEXT_TELEMETRY_DISABLED: "1"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - run: npm ci

      # Server/client boundary audit. Catches the class of error that only
      # surfaces at runtime otherwise — e.g. a non-async export from a
      # "use server" module, which 500s the page that imports it.
      - name: Boundary check
        run: node scripts/check-boundaries.mjs

      - name: Type check
        run: npx tsc --noEmit

      # The real gate. Everything above passes on code that still fails to
      # compile; this is what proves the app builds.
      - name: Build
        run: npm run build

      - name: Unit + integration tests
        run: npm test

      # Migrations must apply cleanly to an empty database, and applying them
      # twice must be a no-op — that is exactly what every deploy does.
      - name: Migrations apply to a real Postgres
        run: |
          node scripts/migrate.mjs
          node scripts/migrate.mjs

      - name: Ledger idempotency guard still holds
        run: node scripts/prove-null-hole.mjs

  deploy:
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to production over SSH
        env:
          KEY: ${{ secrets.SERVER_SSH_KEY }}
          HOST: ${{ secrets.SERVER_HOST }}
        run: |
          set -euo pipefail

          if [ -z "${KEY:-}" ] || [ -z "${HOST:-}" ]; then
            echo "::warning::SERVER_SSH_KEY / SERVER_HOST not set — skipping deploy."
            echo "Tests passed; nothing was deployed. See STEP_BY_STEP.md Phase 2."
            exit 0
          fi

          mkdir -p ~/.ssh
          printf '%s\n' "$KEY" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          SSH="ssh -i $HOME/.ssh/id_deploy -o StrictHostKeyChecking=accept-new root@$HOST"

          # Distinguish "server not set up yet" from "deploy genuinely broke".
          # Without this the job just exits 1 and you have to go digging.
          if ! $SSH 'test -d /root/grihasti/.git'; then
            echo "::error::/root/grihasti does not exist on $HOST yet."
            echo ""
            echo "Tests passed and the build is fine — the server just hasn't been"
            echo "set up. Run Phase 3 of STEP_BY_STEP.md once, then push again."
            echo "It is a one-time step: clone the repo, write .env, docker compose up."
            exit 1
          fi

          if ! $SSH 'test -f /root/grihasti/.env'; then
            echo "::error::/root/grihasti/.env is missing on $HOST."
            echo "The app cannot start without DB_PASSWORD. See STEP_BY_STEP.md Step 3.6."
            exit 1
          fi

          $SSH 'cd /root/grihasti && git pull --ff-only && docker compose up -d --build'

          echo "Waiting for the container to come up..."
          sleep 15
          if $SSH 'docker ps --filter name=grihasti-web --filter status=running -q | grep -q .'; then
            echo "Deployed. grihasti-web is running."
          else
            echo "::error::grihasti-web is not running after deploy. Recent logs:"
            $SSH 'cd /root/grihasti && docker compose logs --tail 40 web' || true
            exit 1
          fi
