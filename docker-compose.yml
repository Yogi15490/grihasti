# Grihasti — production stack.
#
# Deliberately does NOT run its own Caddy. The box already has one (from the
# workrize stack) owning ports 80/443 and terminating Cloudflare origin certs
# for workrize.in, coldpressery.in and farmsae.com. A second Caddy would fight
# it for those ports.
#
# Instead grihasti's web container joins workrize's EXISTING compose network,
# so the running Caddy can reach `grihasti-web:3000` by name. This direction
# was chosen on purpose: the alternative (a new shared network) would mean
# editing workrize's docker-compose.yml, and workrize is a live site. Here the
# only change on that side is an append to its Caddyfile.
#
# Override the network name with WORKRIZE_NETWORK if it differs.

services:
  db:
    image: postgres:16
    container_name: grihasti-db
    restart: always
    environment:
      POSTGRES_DB: ${DB_NAME:-grihasti}
      POSTGRES_USER: ${DB_USER:-grihasti}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
    volumes:
      - grihasti_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-grihasti}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks: [internal]

  web:
    build: .
    container_name: grihasti-web
    restart: always
    env_file: .env
    environment:
      DATABASE_URL: postgres://${DB_USER:-grihasti}:${DB_PASSWORD}@db:5432/${DB_NAME:-grihasti}
      # Traffic to the database never leaves the compose network.
      PGSSL: disable
      NODE_ENV: production
    depends_on:
      db:
        condition: service_healthy
    # Migrations run before the server accepts traffic. The runner is
    # idempotent, so a deploy with no new migrations is a no-op.
    command: >
      sh -c "node scripts/migrate.mjs && node server.js"
    networks: [internal, edge]

volumes:
  grihasti_pgdata:

networks:
  internal:
  edge:
    external: true
    name: ${WORKRIZE_NETWORK:-workrize_default}
